name: every-country-is-unique-backend

services:
  api:
    container_name: api-every-country-is-unique
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./environment/.env.${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  postgres:
    container_name: postgres-every-country-is-unique
    image: postgres:latest
    env_file:
      - ./environment/.env.${NODE_ENV:-development}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data: 