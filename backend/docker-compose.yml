name: every-country-is-unique-backend
version: '3.8'

services:
  api:
    container_name: api-every-country-is-unique
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./environment/.env.${NODE_ENV:-development}
    depends_on:
      - postgres

  postgres:
    container_name: postgres-every-country-is-unique
    image: postgres:latest
    env_file:
      - ./environment/.env.${NODE_ENV:-development}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 