name: every-country-is-unique-frontend
version: '3.8'

services:
  web:
    container_name: web-every-country-is-unique
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    env_file:
      - ./environment/.env.${NODE_ENV:-development}
    command: npm run ${NODE_ENV:-development} 